<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>MediaChips</title>
</head>

<body>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background:
        radial-gradient(ellipse 70% 55% at 28% 18%, rgba(122, 110, 240, 0.14), transparent 60%),
        radial-gradient(ellipse 55% 45% at 78% 78%, rgba(240, 161, 26, 0.1), transparent 55%),
        linear-gradient(160deg, #f7f6fb 0%, #f3f1f8 48%, #faf9fc 100%);
      color: #2c2940;
      font-family: Helvetica, Arial, sans-serif;
    }

    .loading {
      user-select: none;
      -webkit-user-drag: none;
      -webkit-user-select: none;
      width: min(34vw, 168px);
      height: auto;
      border-radius: 28px;
      filter: drop-shadow(0 8px 18px rgba(80, 70, 140, 0.12));
      animation: pulse 2.4s ease-in-out infinite;
    }

    .name {
      font-size: clamp(1.35rem, 3.4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(44, 41, 64, 0.5);
    }

    @keyframes pulse {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-4px) scale(1.04);
      }
    }
  </style>
  <img src="./icons/logo.png" class="loading" alt="">
  <div class="name">MediaChips</div>
  <div class="tagline">Organize your media</div>
</body>

</html>
